{% extends "social/base.html" %}

{% from "social/macros.html" import m_box %}

{% block content %}

  {% call m_box(_("User directory")) %}

    <form class="mb-0" method="POST">
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200" id="users-table">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-20"></th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Nom</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/5">Inscription</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/5">Dernière activité</th>
            </tr>
          </thead>

          <tbody class="divide-y divide-gray-100">
            <tr>
              <td colspan="4" class="px-4 py-8 text-center text-gray-500">
                Loading data...
              </td>
            </tr>
          </tbody>

          <tfoot class="bg-gray-50">
            <tr>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-20"></th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Nom</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/5">Inscription</th>
              <th class="px-4 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider w-1/5">Dernière activité</th>
            </tr>
          </tfoot>
        </table>
      </div>
    </form>

    {%- deferJS %}
      <script>
        'use strict';
        require(
            ['Abilian', 'jquery', 'jquery.dataTables'],
            function (Abilian, $, jqDT) {

              function initUsersTable() {
                var users_table = $('#users-table').dataTable({
                  aoColumns: [
                    {asSorting: []},
                    {asSorting: ["asc", "desc"]},
                    {asSorting: ["asc", "desc"]},
                    {asSorting: ["asc", "desc"]}
                  ],
                  {# see http://datatables.net/ref #}
                  sPaginationType: "bootstrap",
                  bFilter: true,
                  bLengthChange: false,
                  bStateSave: true,
                  iDisplayLength: 50,
                  bProcessing: true,
                  bServerSide: true,
                  sAjaxSource: "{{ url_for(".users_dt_json") }}"
                });
              }

              Abilian.fn.onAppInit(initUsersTable)
            }
        );
      </script>
    {%- enddeferJS %}

  {% endcall %}

{% endblock %}
