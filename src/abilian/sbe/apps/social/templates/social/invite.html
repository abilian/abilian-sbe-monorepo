{% extends "social/base.html" %}

{% block content %}
  <h2 class="text-xl font-semibold text-gray-900 mb-4">{{ _("Invite colleagues to join this community") }}</h2>

  <p class="text-gray-600 mb-6">
    {{ _("Please enter the email addresses of people you'd like to invite to the community. Enter one email address per line.") }}
  </p>

  <form action="/social/invite" method="POST" id="edit-form" class="space-y-6">
    <fieldset class="space-y-4">
      <div class="mb-4">
        <label for="emails" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Emails") }}</label>
        <textarea id="emails" name="emails" cols="40" rows="10"
                  class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
      </div>

      <div class="mb-4">
        <label for="message" class="block text-sm font-medium text-gray-700 mb-1">{{ _("Personnalized message") }}</label>
        <textarea id="message" name="message" cols="40" rows="10"
                  class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"></textarea>
      </div>
    </fieldset>

    <div class="flex gap-2 pt-4 border-t border-gray-200">
      <button type="submit" class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
              name="action" value="invite">{{ _("Invite") }}</button>
      <button type="submit" class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
              name="action" value="cancel">{{ _("Cancel") }}</button>
    </div>
  </form>

{% endblock %}
