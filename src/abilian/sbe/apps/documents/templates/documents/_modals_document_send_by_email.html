{% if obj %}
  {% set doc = obj %}
{% endif %}
<div class="modal fixed inset-0 z-50 hidden" id="modal-send-by-email" role="dialog" data-keyboard="true">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form id="modal-email-form" action="" method="POST">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Send by email") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Recipient") }}</label>
            <div class="flex">
              <span class="inline-flex items-center px-3 border border-r-0 border-gray-300 rounded-l-md bg-gray-50 text-gray-500 text-sm">
                @
              </span>
              <input class="flex-1 block w-full px-3 py-2 border border-gray-300 rounded-r-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                     id="prependedInput" type="text" name="recipient"
                     value="{{ request.args.get('recipient', '') }}"/>
            </div>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ _("Message") }}</label>
            <textarea name="message"
                      class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
                      rows="6"
                      placeholder="{{ _('Message...') }}">{{ request.args.get('message', '') }}</textarea>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit">
            {{ _("Send") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
