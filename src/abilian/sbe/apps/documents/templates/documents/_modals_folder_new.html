<div class="modal fixed inset-0 z-50 hidden" id="modal-new-folder" role="dialog">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form method="POST" action="{{ folder_post_url }}" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Create a new folder") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="inputName2">{{ _("Name") }}</label>
            <input type="text" id="inputName2" name="title" value=""
                   data-check-url="{{ url_for(".check_valid_name", community_id=g.community.slug) }}"
                   class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
            <span class="help-block hidden text-sm text-gray-500 mt-1"></span>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="inputDescription2">{{ _("Description") }}</label>
            <textarea rows="5"
                      class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                      id="inputDescription2" name="description"></textarea>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit" name="action" value="new">
            {{ _("Create folder") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{% deferJS %}
  <script>
    require(
        ['Abilian', 'SBEFolderEditSetup'],
        function (Abilian, setupFolderEdit) {
          Abilian.fn.onAppInit(function () {
            setupFolderEdit($('#modal-new-folder'),
                '{{ folder.id }}',
                'new');
          });
          $('#modal-new-folder input[type="text"]').preventEnterKey();

        });
  </script>
{%- enddeferJS %}
