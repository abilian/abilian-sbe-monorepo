{# Move Files Modal - Alpine.js version #}
<div x-show="showMove"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     role="dialog"
     aria-modal="true">
  <div class="flex min-h-screen items-center justify-center p-4">
    <div x-show="showMove"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="showMove = false"
         class="fixed inset-0 bg-black/50"></div>

    <div x-show="showMove"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="relative w-full max-w-lg bg-white rounded-lg shadow-xl">
      <form method="POST" id="modal-folder-move" action="{{ folder_post_url }}" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">{{ _("Move files or documents") }}</h3>
          <button type="button" @click="showMove = false" class="text-gray-400 hover:text-gray-500 text-2xl">&times;</button>
        </div>

        <div id="modal-move-files-directory-listing" class="p-4">
          <nav class="flex mb-4" aria-label="Breadcrumb">
            <ol class="breadcrumb inline-flex items-center space-x-1"></ol>
          </nav>
          <table class="w-full text-sm">
            <thead>
              <tr>
                <th class="w-4"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100"></tbody>
          </table>
        </div>

        <div class="flex justify-end gap-2 p-4 border-t border-gray-200">
          <div id="modal-move-files-inputs" class="hidden"></div>
          <button @click="showMove = false" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _('Cancel') }}
          </button>
          <button id="modal-move-button-submit"
                  class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit" name="action" value="move">
            {{ _("Move to selected folder") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
