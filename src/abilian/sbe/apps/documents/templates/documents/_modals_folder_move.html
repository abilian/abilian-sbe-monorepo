<div class="modal fixed inset-0 z-50 hidden" id="modal-move-files" role="dialog">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form method="POST" id="modal-folder-move" action="{{ folder_post_url }}" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">{{ _("Move files or documents") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div id="modal-move-files-directory-listing" class="modal-body p-4">
          <nav class="flex mb-4" aria-label="Breadcrumb">
            <ol class="breadcrumb inline-flex items-center space-x-1"></ol>
          </nav>
          <table class="w-full text-sm">
            <thead>
              <tr>
                <th class="w-4"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-gray-100"></tbody>
          </table>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <div id="modal-move-files-inputs" class="hidden"></div>
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _('Cancel') }}
          </button>
          <button id="modal-move-button-submit"
                  class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit" name="action" value="move">
            {{ _("Move to selected folder") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
