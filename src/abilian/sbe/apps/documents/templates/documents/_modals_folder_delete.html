{% if obj %}
  {% set doc = obj %}
{% endif %}
<div class="modal fixed inset-0 z-50 hidden" id="modal-delete-folder" role="dialog" data-keyboard="true">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form id="modal-delete-folders"
            action="{{ url_for('.document_delete', doc_id=doc.id, community_id=doc.community.slug) }}"
            method="POST">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Delete Folder") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4 text-gray-700">
          {{ _('Are you sure you want to delete the folder : ') }}
          <span id="delete-folder-title" class="font-semibold">{{ doc.title }}</span>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <input type="hidden" name="action" value="delete"/>
          <button type="button"
                  class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-md hover:bg-red-700"
                  onclick="this.form.submit()">
            {{ _("Really Delete") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
