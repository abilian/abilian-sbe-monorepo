<div class="modal fixed inset-0 z-50 hidden" id="modal-add-group-local-role" role="dialog" data-keyboard="true">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form method="POST"
            action="{{ url_for(".permissions_update", folder_id=folder.id, community_id=folder.community.slug) }}"
            enctype="multipart/form-data">
        {{ csrf.field() }}
        <input type="hidden" name="action" value="add-group-role"/>

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Add a local role for a group") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="group-select">{{ _("Group") }}</label>
            <select data-toggle="select2" id="group-select" name="group"
                    class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              {% for group in all_groups %}
                <option value="{{ group.id }}">{{ group.name }}</option>
              {% endfor %}
            </select>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="role-select-for-group">{{ _("Role") }}</label>
            <select data-toggle="select2" id="role-select-for-group" name="role"
                    class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
              <option value="reader">{{ _("Reader") }}</option>
              <option value="writer">{{ _("Writer") }}</option>
              <option value="manager">{{ _("Manager") }}</option>
            </select>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit" name="action" value="add-local-role">
            {{ _("Add local role") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
