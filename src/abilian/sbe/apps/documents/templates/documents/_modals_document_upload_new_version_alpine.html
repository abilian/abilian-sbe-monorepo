{% if obj %}
  {% set doc = obj %}
{% endif %}

{# Upload New Version Modal - Alpine.js version #}
<div x-show="showUpload"
     x-cloak
     class="fixed inset-0 z-50 overflow-y-auto"
     role="dialog"
     aria-modal="true">
  <div class="flex min-h-screen items-center justify-center p-4">
    <div x-show="showUpload"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="showUpload = false"
         class="fixed inset-0 bg-black/50"></div>

    <div x-show="showUpload"
         x-transition:enter="ease-out duration-300"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         x-transition:leave="ease-in duration-200"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="relative w-full max-w-lg bg-white rounded-lg shadow-xl">
      <form id="fileupload" class="modal-replacedoc-form" action="" method="POST" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="text-lg font-semibold text-gray-900">{{ _("Upload new version") }}</h3>
          <button type="button" @click="showUpload = false" class="text-gray-400 hover:text-gray-500 text-2xl">&times;</button>
        </div>

        <div class="p-4">
          <div class="mb-4">
            <input type="file" name="file"
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-medium file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
          </div>
        </div>

        <div class="flex justify-end gap-2 p-4 border-t border-gray-200">
          <button @click="showUpload = false" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit">
            {{ _("Upload") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
