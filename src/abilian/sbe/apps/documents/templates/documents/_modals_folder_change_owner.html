<div class="modal fixed inset-0 z-50 hidden" id="modal-change-owner" role="dialog">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form method="POST" action="{{ folder_post_url }}" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Change owner of selected files") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="new_owner">{{ _("New owner") }}</label>
            <input type="text" name="new_owner" value=""
                   class="block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"/>
            <span class="help-block hidden text-sm text-gray-500 mt-1"></span>
          </div>

          <div class="hidden selected-items"></div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit" name="action" value="change-owner">
            {{ _("Change owner") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{%- deferJS %}
  <script>
    require(
        ['Abilian', 'jquery'],
        function (Abilian, $) {

          Abilian.fn.onAppInit(
              function () {
                var modal = $('#modal-change-owner'),
                    input = modal.find('input[name="new_owner"]');

                input.attr("style", "min-width: 220px")
                .select2({
                  minimumInputLength: 2,
                  ajax: {
                    url: "{{ url_for("social.users_json") }}",
                    dataType: 'json',
                    quietMillis: 100,
                    data: function (term, page) {
                      return {
                        q: term,
                        with_membership: {{ g.community.id | tojson }}
                      };
                    },
                    results: function (data, page) {
                      return {results: data.results, more: false};
                    }
                  },
                  allowClear: false,
                  formatResult: function (state, container, query, escapeMarkup) {
                    var markup = [], text;
                    window.Select2.util.markMatch(state.name, query.term, markup, escapeMarkup);
                    text = '<b>' + markup.join("") + '</b>';
                    if (state.role) {
                      text += ' <small class="inline-block px-2 py-0.5 text-xs font-medium bg-gray-100 text-gray-700 rounded float-right">'
                          + escapeMarkup(state.role)
                          + '</small> ';
                    }

                    if (state.email) {
                      text += ' <br /><i>' + escapeMarkup(state.email) + '</i> ';
                    }
                    return text;
                  }
                });

                $("#s2id_new_owner-select a span").text("");
                input.attr("value", "");

                modal.on('show.bs.modal', function () {
                  var listing_form = $(document.forms["folder-listing"]),
                      elements = listing_form.find("input[name='object-selected']:checked"),
                      container = modal.find('.selected-items');
                  container.empty();
                  elements.clone()
                  .attr('type', 'hidden')
                  .appendTo(container);
                });
              });
        });
  </script>
{%- enddeferJS %}
