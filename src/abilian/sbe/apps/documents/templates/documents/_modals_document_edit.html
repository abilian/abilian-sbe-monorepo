{% if obj %}
  {% set doc = obj %}
{% endif %}
<div class="modal fixed inset-0 z-50 hidden" id="modal-edit" role="dialog" data-keyboard="true">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form id="modal-edit-form" method="POST"
            action="{{ url_for('.document_edit', doc_id=doc.id, folder_id=folder.id, community_id=doc.community.slug) }}"
            enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Edit document properties") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4 space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="inputName">{{ _("Name") }}</label>
            <input type="text"
                   class="form-document-title block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                   id="inputName" name="title"
                   data-check-url="{{ url_for('.check_valid_name', community_id=g.community.slug) }}"
                   value="{{ doc.title }}">
            <span class="help-block text-sm text-gray-500 mt-1"></span>
          </div>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="inputDescription">{{ _("Description") }}</label>
            <textarea class="form-document-description block w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 resize-y"
                      rows="5" cols="80" id="inputDescription"
                      name="description">{{ doc.description }}</textarea>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700"
                  type="submit" name="action" value="edit">
            {{ _("Save changes") }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

{%- deferJS %}
  <script>
    require(
        ['Abilian', 'SBEFolderEditSetup'],
        function (Abilian, setupFolderEdit) {
          Abilian.fn.onAppInit(function () {
            setupFolderEdit(
                '#modal-edit',
                '{{ doc.id }}',
                'document-edit');

            $('#modal-edit input[type="text"]').preventEnterKey();
          });
        });
  </script>
{%- enddeferJS %}
