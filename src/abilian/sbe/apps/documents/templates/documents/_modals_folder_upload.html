<div class="modal fixed inset-0 z-50 hidden" id="modal-upload-files" role="dialog">
  <div class="fixed inset-0 bg-black/50" data-dismiss="modal"></div>

  <div class="modal-dialog relative mx-auto my-8 max-w-lg">
    <div class="modal-content bg-white rounded-lg shadow-xl">
      <form method="POST" class="b-upload b-upload_multi"
            action="{{ folder_post_url }}" enctype="multipart/form-data">
        {{ csrf.field() }}

        <div class="modal-header flex items-center justify-between p-4 border-b border-gray-200">
          <h3 class="modal-title text-lg font-semibold text-gray-900">{{ _("Upload new files") }}</h3>
          <button type="button" class="text-gray-400 hover:text-gray-500" data-dismiss="modal">&times;</button>
        </div>

        <div class="modal-body p-4">
          <div class="multiupload">
            <div class="btn-file js-fileapi-wrapper inline-flex items-center px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50 cursor-pointer">
              <span class="fa fa-plus mr-2"></span>
              <span>{{ _('Add files to selection') }}</span>
              <input name="file" type="file" class="absolute inset-0 opacity-0 cursor-pointer">
            </div>

            <ul class="js-files b-upload__files mt-4 space-y-2">
              <li class="js-file-tpl border border-gray-200 rounded-lg p-3">
                <div class="b-thumb flex items-start gap-x-4" data-id="<%=uid%>"
                     title="<%-name%> (<%-sizeText%>)">
                  <div class="b-thumb__preview">
                    <div class="b-thumb__preview__pic w-10 h-10 bg-gray-100 rounded"></div>
                  </div>

                  <div class="flex-1 min-w-0">
                    <div class="b-thumb__name">
                      <h4 class="text-sm font-medium text-gray-900 truncate"><%-name%></h4>
                      <span class="text-xs text-gray-500">(<%-sizeText%>)</span>
                    </div>
                  </div>

                  <div class="flex items-center gap-x-2">
                    <div class="w-24" data-fileapi="active.show">
                      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
                        <div class="h-full bg-blue-600 rounded-full transition-all" role="progressbar" data-fileapi="file.progress"
                             style="width: 0%;"></div>
                      </div>
                    </div>

                    <div class="hidden statusicon">
                      <span class="fa text-gray-400"></span>
                    </div>

                    <button type="button"
                            class="b-thumb__del inline-flex items-center justify-center w-8 h-8 text-white bg-red-600 rounded-md hover:bg-red-700"
                            data-fileapi="file.remove">
                      <span class="fa fa-minus"></span>
                    </button>
                  </div>
                </div>
              </li>
            </ul>

            <div class="mt-4 h-2 bg-gray-200 rounded-full overflow-hidden" data-fileapi="active.show">
              <div class="h-full bg-blue-600 rounded-full transition-all" role="progressbar"
                   style="width: 0;" data-fileapi="progress">
              </div>
            </div>
          </div>

          <div class="mt-4">
            <label class="flex items-center">
              <input type="checkbox" name="uncompress_files" value="true"
                     class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500"/>
              <span class="ml-2 text-sm text-gray-700">{{ _('Uncompress ZIP files') }}</span>
            </label>
          </div>
        </div>

        <div class="modal-footer flex justify-end gap-2 p-4 border-t border-gray-200">
          <button data-dismiss="modal" type="button"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            {{ _("Cancel") }}
          </button>
          <div class="js-upload inline-flex items-center px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-md hover:bg-green-700 cursor-pointer">
            <span>{{ _("Upload") }}</span>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

{%- deferJS %}
  <script>
    require(
        ['Abilian', 'SBEFolderUploadSetup'],
        function (Abilian, setupFolderUpload) {
          var messages = {
            fileUploadError: {{ _('Error - File not uploaded')|tojson }},
            fileTooLargeError: {{ _('Error: maximum file size exceeded')|tojson }}
          };

          Abilian.fn.onAppInit(function () {
            setupFolderUpload('modal-upload-files',
                {{ folder_post_url|tojson }},
                messages);
          });
        });
  </script>
{%- enddeferJS %}
