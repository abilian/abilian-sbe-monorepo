{% extends "base.html" %}

{% block main %}

<div class="flex justify-center px-4">
  <div class="w-full max-w-md">

    <h2 class="text-xl font-semibold text-gray-900 mb-4">{{ _("Please choose a new password") }}</h2>

    <p class="text-sm text-gray-600 mb-6">
      Your password must be at least 8 characters including one uppercase, one lowercase
      and a number.
    </p>

    <form method="POST" name="change_password" role="form" class="space-y-4">
      {{ csrf.field() }}
      <div>
        <input type="password" name="password" placeholder="{{ _("Password") }}"
               autofocus="autofocus"
               class="block w-full px-4 py-3 text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
      </div>
      <div class="flex gap-3">
        <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                type="submit">{{ _("Change password") }}</button>
        <button class="px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50"
                type="submit" name="action" value="cancel">{{ _("Cancel") }}</button>
      </div>
    </form>
  </div>
</div>

{% endblock %}
