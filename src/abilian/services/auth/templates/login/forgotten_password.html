{% extends "base.html" %}

{% block main %}

<div class="flex justify-center px-4">
  <div class="w-full max-w-sm">
    <h2 class="text-xl font-semibold text-gray-900 mb-6">{{ _("Forgot password?") }}</h2>

    <form action="{{ url_for(".forgotten_pw") }}" method="POST" name="login" role="form" class="space-y-4">
      {{ csrf.field() }}
      <div>
        <input type="email" name="email" placeholder="E-Mail" autofocus="autofocus"
               class="block w-full px-4 py-3 text-sm border border-gray-300 rounded-lg shadow-sm focus:ring-blue-500 focus:border-blue-500" />
      </div>
      <div>
        <button class="w-full px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                type="submit">
          {{ _("Send me a new password") }}
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
