{% extends "base.html" %}

{% block main %}
<div class="flex justify-center py-12">

  <div class="w-full max-w-md px-6">
    <div class="bg-white rounded-lg shadow-lg p-8">
      <h2 class="text-2xl font-bold text-gray-900 text-center mb-6">
        {%- if config.SITE_NAME %}
          {{ _("Login to %(site_name)s", site_name=config.SITE_NAME) }}
        {%- else %}
          {{ _("Login") }}
        {%- endif %}
      </h2>

      <form action="{{ url_for('.login_post') }}" method="POST" name="login" role="form" class="space-y-4">
        <div>
          <label for="email" class="sr-only">E-Mail</label>
          <input type="text" name="email" id="email" placeholder="E-Mail" value="{{ email|default }}"
                 class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                 autofocus="autofocus" />
        </div>
        <div>
          <label for="password" class="sr-only">{{ _('Password') }}</label>
          <input type="password" name="password" id="password" placeholder="{{ _('Password') }}"
                 class="w-full px-4 py-3 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500" />
        </div>

        <div class="flex justify-between items-center pt-2">
          <input type="hidden" name="next" value="{{ next_url or '' }}" />
          <button type="submit"
                  class="px-6 py-3 text-white bg-blue-600 rounded-md hover:bg-blue-700 font-medium transition-colors">
            {{ _("Sign in") }}
          </button>
          <a href="{{ url_for('.forgotten_pw_form') }}"
             class="text-sm text-blue-600 hover:text-blue-800">
            {{ _("Forgot password?") }}
          </a>
        </div>
      </form>
    </div>
  </div>

</div>
{% endblock %}
