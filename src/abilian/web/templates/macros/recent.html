{% macro m_recent_items(recent_items) %}
  {%- if recent_items %}
    <div class="bg-gray-50 border border-gray-200 rounded-lg p-4">
      <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wide mb-3">{{ _("Recent items") }}</h3>
      <ul class="space-y-2">
        {%- for item in recent_items %}
          <li>
            <a href="{{ item.url }}" class="flex items-center gap-2 text-sm text-gray-700 hover:text-blue-600">
              <img alt="" src="/static/icons/{{ item.type }}-12.png" class="w-3 h-3"/>
              <span class="truncate">{{ item.name }}</span>
            </a>
          </li>
        {%- endfor %}
      </ul>
    </div>
  {%- endif %}
{% endmacro %}
