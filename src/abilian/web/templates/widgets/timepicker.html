{# `timepicker` and `bootstrap-timepicker` are JS hooks, not styles: abilian.js
   initialises $(".timepicker") and the plugin looks for its own wrapper. #}
<div class="bootstrap-timepicker relative flex w-full">
  <input id="{{ id }}" size="13" type="text" value="{{ value }}"
         class="timepicker block w-full px-3 py-2 text-base leading-normal text-gray-700
                bg-white border border-gray-300 rounded-l-md transition-all duration-150"
  {%- for attr, val in timepicker_attributes.items() %} {{ attr }}={{ val }}{%- endfor %} {%- if required %}
  required{%- endif %} />
  <span class="flex items-center px-3 py-2 text-base font-normal text-gray-700
               bg-gray-100 border border-l-0 border-gray-300 rounded-r-md">
    <i class="fa fa-clock-o"></i>
  </span>
</div>
