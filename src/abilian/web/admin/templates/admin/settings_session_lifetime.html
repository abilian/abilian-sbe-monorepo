<div class="flex flex-wrap items-end gap-4">
  <div>
    <label for="{{ key.id }}:days" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Days') }}</label>

           class="block w-20 px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
           value="{{ key.days }}" name="{{ key.id }}:days"/>
  </div>

  <div>
    <label for="{{ key.id }}:hours" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Hours') }}</label>

           value="{{ key.hours }}" name="{{ key.id }}:hours"/>
  </div>

  <div>
    <label for="{{ key.id }}:minutes" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Minutes') }}</label>
    <input type="text"
           class="block w-20 px-3 py-2 text-sm border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
           value="{{ key.minutes }}" name="{{ key.id }}:minutes"/>
  </div>
