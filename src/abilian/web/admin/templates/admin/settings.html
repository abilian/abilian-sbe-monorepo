{% extends "admin/_base.html" %}

{% from "macros/box.html" import m_box %}

{% block content %}
  {%- call m_box(title=_("Settings")) %}
    <form method="POST" role="form" class="space-y-6">
      {{ csrf.field() }}

      {%- for k in keys %}
        <div>
          <label for="{{ k.id }}" class="block text-sm font-medium text-gray-700 mb-1">{{ k.label or k.id }}</label>
          {%-if k.description %}
            <p class="text-sm text-gray-500 mb-2">{{ k.description }}</p>
          {%- endif %}
          {{ k }}
        </div>
      {%- endfor %}

      <div class="pt-4">
        <button class="px-4 py-2 text-sm font-medium text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                type="submit" name="action" value="save">{{ _("Save") }}</button>
      </div>
    </form>
  {%- endcall %}
{% endblock %}
