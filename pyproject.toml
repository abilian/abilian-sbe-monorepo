[project]
name = "abilian-sbe"
version = "1.1.15"
description = "Social Business platform (entreprise collaboration and information management)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "LGPL-2.0-or-later"
authors = [{ name = "Abilian SAS", email = "sales@abilian.com" }]
dependencies = [
    # Flask and friends
    "flask>=3.0.2,<3.1.0",
    "jinja2>=3.1.3,<3.2.0",
    "werkzeug>=3.1.0,<3.2",
    "markupSafe>=2.1.4,<2.2.0",
    # Flask extensions
    "flask-babel>=1.0.0,<1.1.0",
    "flask-assets==2.1.0",
    "flask-mail>=0.9.1",
    "flask-migrate>=4.0.5,<4.1.0",
    "flask-login>=0.6.3,<0.7.0",
    "flask-super>=0.2.8",
    "flask-talisman>=1.1.0,<1.2.0",
    # Transitive dependencies, but called explicitly in our code
    "Babel",
    "blinker>=1.6.2",
    "click>=8.1.3",
    "itsdangerous>=2.1.2",
    "numpy>=1.26.3,<2.0.0",
    "pytz",
    # Persistence
    "sqlalchemy==1.4.35",
    "flask-sqlalchemy==3.0.1",
    "psycopg2>=2.9.9,<3.0.0",
    # Forms
    "flask-wtf==1.2.0",
    "wtforms==3.1.2",
    "WTForms-Alchemy==0.18.0",
    "wtforms-sqlalchemy>=0.4.1,<0.5.0",
    # Web assets
    "webassets==2.0",
    "jsmin",
    "cssmin",
    "closure==20161201",
    #
    "python-dateutil>=2.8.2,<3.0.0",
    # Search
    "whoosh-reloaded>=2.7.5,<3.0.0",
    # task queue
    "dramatiq>=1.15.0,<2.0.0",
    "redis>=4.6.0,<5.0",
    "flask-dramatiq>=0.6.0,<0.7.0",
    "dramatiq-abort>=1.1.0,<2.0.0",
    "apscheduler>=3.10.4,<4.0.0",
    # Infra
    "loguru>=0.7.2,<0.8.0",
    "filelock>=3.15,<4.0",
    # Security
    "bleach[css]>=6.2.0,<7.0.0",
    "bcrypt",
    "defusedxml>=0.7.1,<0.8.0",
    # Various libs
    "deprecated",
    "lxml",
    "tqdm",
    "python-magic",
    "pillow",
    "pandas>=2.2.0",
    "validate_email",
    "toolz",
    "html2text>=2024,<2025",
    "devtools",
    "svcs>=24.1.0",
    "attrs>=24.2.0",
    # Markdown support for Wiki
    "markdown>=3,<4",
    # Language and charset detection
    "langid>=1.1.6",
    "chardet",
    # XLSX support
    "xlwt",
    "openpyxl",
    # Dev and prod server
    "gunicorn",
    "sentry-sdk[flask]",
    # Geoip DB
    "maxminddb",
    # "mmdb_writer",
    # "netaddr",
    #
    "pytest>=8.3.3",
    "hyperlink>=21.0.0",
    "python-dotenv>=1.0.1",
    "flask-vite>=0.6.1",
]

[project.urls]
Repository = "https://github.com/abilian/abilian-sbe"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/abilian"]

[tool.uv]
dev-dependencies = [
    "abilian-devtools>=0.7,<0.8",
    # "flask-debugtoolbar",
    # "sqlparse>=0.4.4,<0.5.0",
    # Dev server
    "honcho",
    # Testing
    "html5lib",
    "hyperlink",
    "pytest>=8,<9",
    "tox>=4.5.1,<5.0.0",
    "pytest-flask",
    "flask-linktester",
    # Type hints
    "types-bleach",
    "types-deprecated",
    "types-python-dateutil",
    "types-pytz",
    "types-pyyaml",
    "types-redis",
    "types-requests",
    "types-setuptools",
    "types-chardet",
    "types-Markdown",
    "types-toml>=0.10.8.7,<0.11.0.0",
    # Tools
    "pyupgrade",
    "deptry",
    # Documentation
    "mkdocs-material>=9.5.4,<10.0.0",
    "pip-outdated>=0.7.0",
    "flynt>=1.0.1",
    "snoop>=0.6.0",
    "pytest-archon>=0.0.6",
    "typeguard>=4.4.1",
    "auto-type-annotate>=1.1.1",
    "ty>=0.0.0a7",
    "pyrefly>=0.32.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
filterwarnings = [
    'ignore::DeprecationWarning',
    'ignore::sqlalchemy.exc.SAWarning',
]
# addopts = "-ra -q"
testpaths = ["tests"]
python_files = ["test_*.py", "tests.py", "test.py", "*_tests.py"]
# norecursedirs = .* env* _build *.egg *.egg-info tools deploy etc docs demo bin

# -----------------------------------------------------------------------------


[tool.deptry.per_rule_ignores]
# X defined as a dependency but not used in the codebase
DEP002 = [
    # Used by Flask
    "python-dotenv",
    # Used by webassets
    'jsmin',
    'cssmin',
    'closure',
    # Used implicitly by SQLA
    'psycopg2',
    # Web
    'gunicorn',
]

# X imported but missing from the dependency definitions
DEP001 = [
    'pkg_resources',
    'clamd',
    'flask_debugtoolbar',
]

# X imported but declared as a dev dependency
DEP004 = ['flask_debugtoolbar', 'html5lib']

# -----------------------------------------------------------------------------


[tool.pyright]
exclude = ['.nox', 'tests', 'noxfile.py']
include = ["src"]
# strict = ["src"]

# False positives
reportPrivateImportUsage = false

# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.10"

ignore_missing_imports = true
#warn_redundant_casts = true
#warn_no_return = true
#warn_return_any = true
#strict_optional = true
#warn_unused_ignores = true

# exclude = [
#     '^file1\.py$',  # TOML literal string (single-quotes, no escaping necessary)
#     "^file2\\.py$",  # TOML basic string (double-quotes, backslash and other characters need escaping)
# ]

# -----------------------------------------------------------------------------

[tool.pyrefly]
python-version = "3.10.0"
ignore-missing-imports = ["*"]
# nothing
